name: release

# 打 tag（v0.5.4 这种）就自动构建 deb 并挂到 Release，不用手动上传。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建 deb
        run: |
          chmod +x build-deb.sh packaging/yuketang-courseware
          ./build-deb.sh
          ls -l dist/

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.deb \
            --title "${GITHUB_REF_NAME}" \
            --notes "安装：\`sudo apt install ./yuketang-courseware_${GITHUB_REF_NAME#v}_all.deb\`（依赖由 apt 一并装好）。详见 [README](../blob/main/README.md)。" \
            --verify-tag
