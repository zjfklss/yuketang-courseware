name: release

# 打 tag（v*）时构建 Ubuntu .deb，与 Windows workflow 一起挂到同一次 Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建 deb
        run: |
          chmod +x build-deb.sh packaging/yuketang-courseware
          ./build-deb.sh
          ls -l dist/

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          name: ${{ github.ref_name }}
          body: |
            **Ubuntu / Debian**：下载 `.deb` 后执行 `sudo apt install ./yuketang-courseware_*.deb`（依赖由 apt 一并装好）。
            **Windows**：同 Release 里的 `yuketang-courseware.exe`，双击即可；也有 cli 与 zip。
            详见 [README](../blob/main/README.md)。
          fail_on_unmatched_files: true
