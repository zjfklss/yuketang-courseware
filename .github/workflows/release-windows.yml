name: release-windows

# 打 tag（v*）时构建单文件 exe，直接挂到 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -r requirements-windows.txt

      - name: 跑测试
        run: python -m unittest discover -s tests -v

      - name: 生成图标
        run: python packaging/windows/make-ico.py

      - name: PyInstaller 打包
        run: python -m PyInstaller --noconfirm --clean packaging/windows/yuketang-courseware.spec

      - name: 打 zip（GUI + CLI）
        run: |
          Compress-Archive -Path dist/yuketang-courseware.exe,dist/yuketang-courseware-cli.exe `
            -DestinationPath yuketang-courseware-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: yuketang-courseware-windows
          path: |
            dist/yuketang-courseware.exe
            dist/yuketang-courseware-cli.exe
            yuketang-courseware-windows.zip

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/yuketang-courseware.exe
            dist/yuketang-courseware-cli.exe
            yuketang-courseware-windows.zip
          name: ${{ github.ref_name }}
          body: |
            雨课堂（RainClassRoom）课件下载器：把已加入课程的幻灯片收成按讲分好的 PDF。

            **Ubuntu / Debian**：同 Release 里的 `.deb`，`sudo apt install ./yuketang-courseware_*.deb`。
            **Windows**：下载 `yuketang-courseware.exe` 双击即可；命令行用 `yuketang-courseware-cli.exe`（也有 zip）。
            详见 [README](../blob/main/README.md)。
          fail_on_unmatched_files: true
