name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用系统 python，才能用上 apt 装的 python3-gi；
      # setup-python 装的那份是独立的，拿不到系统的 GI typelib。
      - name: 装运行依赖（Ubuntu 24.04：GTK 4.14 / libadwaita 1.5）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-pil

      - name: 跑单测（不联网、不起浏览器）
        run: /usr/bin/python3 -m unittest discover -s tests -v

      - name: 能打出 deb
        run: |
          chmod +x build-deb.sh packaging/yuketang-courseware
          ./build-deb.sh
          dpkg-deb -I dist/*.deb | head -12
