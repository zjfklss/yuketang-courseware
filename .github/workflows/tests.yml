name: tests

# 只在手动触发和 PR 上跑：每次 push 都跑会在提交列表里留下红叉，
# 而这里的失败原因（镜像环境）跟代码质量无关。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 单测用不着 Gtk4：界面相关的检查在没装 GI 时会自动跳过。
      # 这样 CI 不依赖 apt（镜像里的第三方源经常失效，apt update 会拖垮整条流水线）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 装测试依赖
        run: python -m pip install --quiet --upgrade pip pillow

      - name: 跑单测（不联网、不起浏览器）
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### 单测失败（exit $status）"
              echo '```'
              tail -80 /tmp/test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -80 /tmp/test.log
            exit "$status"
          fi
          tail -3 /tmp/test.log

      - name: 能打出 deb
        run: |
          chmod +x build-deb.sh packaging/yuketang-courseware
          ./build-deb.sh
          dpkg-deb -I dist/*.deb > /tmp/control.txt
          cat /tmp/control.txt

  # 单独一趟：装上 Gtk4 / libadwaita，跑一遍含界面的检查。
  # 环境问题不至于把主流水线染红，但能看出兼容层有没有坏。
  gtk:
    runs-on: ubuntu-22.04        # 最老的支持目标：GTK 4.6 / libadwaita 1.0
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 装 Gtk4 / libadwaita
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-pil

      - name: 跑全部单测（含界面兜底检查）
        run: |
          set +e
          /usr/bin/python3 -m unittest discover -s tests -v > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### GTK 环境单测失败（exit $status）"
              echo '```'
              tail -80 /tmp/test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -80 /tmp/test.log
            exit "$status"
          fi
          tail -3 /tmp/test.log

      - name: 环境自检
        run: |
          /usr/bin/python3 -m yuketang_courseware --doctor || true
